<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M21 — Project Graph</title>
  <meta name="description" content="Interactive M21 project graph with dependency and test-result overlays.">
  <style>
    :root {
      --bg: #0f0f1a;
      --border: #0f3460;
      --accent: #e94560;
      --text: #e0e0e0;
      --text-dim: #888;
      --nav-h: 58px;
      --max-w: 960px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      background: rgba(15, 15, 26, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    nav .inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    nav .logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    nav .links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    nav .links a {
      color: #888;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav .links a:hover { color: var(--text); }

    nav .links a.active { color: var(--accent); }

    nav .links a.external-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    nav .links .external-icon {
      width: 14px;
      height: 14px;
      display: inline-flex;
      color: currentColor;
    }

    nav .links .external-icon svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .graph-frame {
      position: absolute;
      top: var(--nav-h);
      left: 0;
      width: 100%;
      height: calc(100% - var(--nav-h));
      border: 0;
      background: var(--bg);
    }

    .fallback {
      position: fixed;
      right: 16px;
      bottom: 12px;
      z-index: 101;
      color: var(--text-dim);
      font-size: 12px;
      text-decoration: none;
      background: rgba(15, 15, 26, 0.8);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
    }

    .fallback:hover { color: var(--text); }

    @media (max-width: 600px) {
      nav .links { gap: 16px; }
    }
  </style>
</head>
<body>
<nav>
  <div class="inner">
    <a href="index.html" class="logo">M21</a>
    <ul class="links">
      <li><a href="index.html">Home</a></li>
      <li><a href="vision.html">Vision</a></li>
      <li><a href="index.html#features">Features</a></li>
      <li><a href="index.html#how-it-works">How it works</a></li>
      <li><a href="spec.html">Spec Format</a></li>
      <li><a href="graph.html" class="active">Project Graph</a></li>
      <li><a class="external-link" href="https://github.com/moejay/m21" target="_blank" rel="noopener noreferrer">GitHub <span class="external-icon" aria-hidden="true"><svg viewBox="0 0 16 16" focusable="false"><path d="M3 3h6v1.5H4.5v7h7V7H13v6H3z"/><path d="M10 3h3v3h-1.5V5.56L7.53 9.53 6.47 8.47l3.97-3.97H10z"/></svg></span></a></li>
    </ul>
  </div>
</nav>

<iframe class="graph-frame" src="graph-export.html" title="M21 project graph"></iframe>
<a class="fallback" href="graph-export.html">Open graph full screen</a>
</body>
</html>
